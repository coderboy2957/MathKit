<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathKit - Access Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.6);
      --text-color: #2d3748;
      --text-muted: #718096;
      --accent-color: #4f46e5;
      --accent-hover: #4338ca;
      --success-color: #10b981;
      --error-color: #ef4444;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      overflow-x: hidden;
    }

    .container {
      width: 90%;
      max-width: 440px;
      padding: 2.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      transition: all 0.3s ease;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #1a202c;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: rgba(255, 255, 255, 0.9);
      font-size: 1rem;
      color: var(--text-color);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent-color);
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-color);
      border: 1px solid #e2e8f0;
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    .message {
      margin-top: 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      min-height: 1.25rem;
    }

    .message.error {
      color: var(--error-color);
    }

    .message.success {
      color: var(--success-color);
    }

    .key-box {
      background: #ffffff;
      border: 1px dashed var(--accent-color);
      padding: 1rem;
      border-radius: 12px;
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 1px;
      margin: 1.5rem 0;
      word-break: break-all;
    }

    /* Embedded App View */
    #app-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: white;
      z-index: 9999;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- VIEW 1: UNLOCK SCREEN -->
  <div id="view-unlock" class="container view active">
    <h1>MathKit Unlock</h1>
    <p class="subtitle">Gib deinen Zugangsschlüssel ein oder erstelle einen neuen 24h-Schlüssel.</p>
    
    <div class="input-group">
      <label for="key-input">Zugangsschlüssel</label>
      <input type="text" id="key-input" placeholder="MK-XXXXXXXXXXXX" autocomplete="off">
    </div>

    <button class="btn btn-primary" onclick="unlockWithKey()">Unlock</button>
    <a href="#" id="btn-get-key" class="btn btn-secondary" onclick="openLinkvertise(event)">Get Key</a>

    <div id="unlock-message" class="message"></div>
  </div>

  <!-- VIEW 2: GET KEY SCREEN (Nach Linkvertise-Weiterleitung) -->
  <div id="view-getkey" class="container view">
    <h1>Dein Schlüssel ist bereit</h1>
    <p class="subtitle">Dieser Schlüssel bleibt genau 24 Stunden lang auf diesem Gerät gültig.</p>

    <div id="generated-key-display" class="key-box">Erzeuge Schlüssel...</div>

    <button class="btn btn-primary" onclick="copyAndUseKey()">Kopieren & Freischalten</button>
  </div>

  <!-- EMBEDDED MATHKIT APP (Full Screen Container) -->
  <div id="app-container">
    <iframe src="https://mathkit.org" id="app-frame" title="MathKit App"></iframe>
  </div>

  <script>
    // ==========================================
    // KONFIGURATION
    // ==========================================
    // TRAGE HIER DEINEN LINKVERTISE-LINK EIN:
    const LINKVERTISE_URL = "DEIN_LINKVERTISE_LINK_HIER"; 

    // Schlüssel-Validierungsparameter
    const KEY_PREFIX = "MK-";
    const SECRET_SALT = "MATHKIT_SALT_2026";
    const VALIDITY_DURATION_MS = 24 * 60 * 60 * 1000; // 24 Stunden

    // Initialisierung beim Laden
    window.addEventListener('DOMContentLoaded', () => {
      checkSavedSession();
      routeView();
    });

    function routeView() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('action') === 'getkey') {
        showView('view-getkey');
        generateAndDisplayKey();
      } else {
        showView('view-unlock');
      }
    }

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function openLinkvertise(e) {
      e.preventDefault();
      if (LINKVERTISE_URL === "DEIN_LINKVERTISE_LINK_HIER" || !LINKVERTISE_URL) {
        alert("Fehler: Es wurde noch kein Linkvertise-Link im Code hinterlegt.");
        return;
      }
      window.location.href = LINKVERTISE_URL;
    }

    // Hash-Funktion zur Verifizierung
    function simpleHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash).toString(36).toUpperCase();
    }

    function generateKeyForTimestamp(timestamp) {
      const timeBlock = Math.floor(timestamp / (1000 * 60 * 60)); // Stündlicher Block
      const signature = simpleHash(timeBlock + SECRET_SALT);
      return `${KEY_PREFIX}${timeBlock.toString(36).toUpperCase()}-${signature}`;
    }

    function generateAndDisplayKey() {
      const now = Date.now();
      const currentKey = generateKeyForTimestamp(now);
      document.getElementById('generated-key-display').innerText = currentKey;
    }

    function validateKey(key) {
      if (!key || typeof key !== 'string') return false;
      const cleanKey = key.trim();
      const now = Date.now();
      
      // Prüfe die letzten 25 Stunden auf Gültigkeit
      for (let i = 0; i <= 25; i++) {
        const testTime = now - (i * 60 * 60 * 1000);
        if (generateKeyForTimestamp(testTime) === cleanKey) {
          return true;
        }
      }
      return false;
    }

    function unlockWithKey() {
      const inputField = document.getElementById('key-input');
      const messageField = document.getElementById('unlock-message');
      const key = inputField.value;

      messageField.className = 'message';
      messageField.innerText = '';

      if (validateKey(key)) {
        const expiry = Date.now() + VALIDITY_DURATION_MS;
        localStorage.setItem('mathkit_session_expiry', expiry.toString());
        messageField.className = 'message success';
        messageField.innerText = 'Schlüssel akzeptiert! Weiterleitung...';
        
        setTimeout(() => {
          showApp();
        }, 800);
      } else {
        messageField.className = 'message error';
        messageField.innerText = 'Ungültiger oder abgelaufener Schlüssel!';
      }
    }

    function copyAndUseKey() {
      const keyText = document.getElementById('generated-key-display').innerText;
      navigator.clipboard.writeText(keyText).then(() => {
        // Automatisch entsperren
        const expiry = Date.now() + VALIDITY_DURATION_MS;
        localStorage.setItem('mathkit_session_expiry', expiry.toString());
        showApp();
      }).catch(() => {
        // Fallback
        const expiry = Date.now() + VALIDITY_DURATION_MS;
        localStorage.setItem('mathkit_session_expiry', expiry.toString());
        showApp();
      });
    }

    function checkSavedSession() {
      const expiry = localStorage.getItem('mathkit_session_expiry');
      if (expiry) {
        if (Date.now() < parseInt(expiry, 10)) {
          showApp();
        } else {
          localStorage.removeItem('mathkit_session_expiry');
        }
      }
    }

    function showApp() {
      document.getElementById('app-container').style.display = 'block';
    }
  </script>
</body>
</html>
