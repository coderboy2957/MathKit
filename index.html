<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    /* Grundlegendes Schlichtes Schwarz-Weiß Design */
    body {
      background: #ffffff;
      color: #000000;
      font-family: monospace, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .view {
      display: none;
      width: 100%;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background: #ffffff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .view.active {
      display: flex;
    }

    /* Taschenrechner Styling (Simpel, Schwarz-Weiß) */
    .calc-container {
      border: 2px solid #000;
      padding: 20px;
      width: 260px;
      background: #fff;
    }

    .calc-screen {
      width: 100%;
      height: 40px;
      background: #fff;
      border: 2px solid #000;
      font-size: 1.2rem;
      text-align: right;
      padding: 5px 10px;
      box-sizing: border-box;
      margin-bottom: 15px;
      font-family: monospace;
    }

    .calc-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .calc-btn {
      padding: 15px;
      background: #fff;
      border: 1px solid #000;
      font-size: 1rem;
      cursor: pointer;
      font-family: monospace;
    }

    .calc-btn:active {
      background: #000;
      color: #fff;
    }

    /* Portal Container (Simpel & Klassisch) */
    .portal-box {
      border: 2px solid #000;
      padding: 30px;
      width: 320px;
      text-align: left;
    }

    h1 {
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 10px;
    }

    p {
      font-size: 0.85rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #000;
      font-family: monospace;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #fff;
      border: 1px solid #000;
      text-align: center;
      text-decoration: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    .btn:hover {
      background: #000;
      color: #fff;
    }

    .message {
      font-size: 0.8rem;
      margin-top: 10px;
      min-height: 1rem;
    }

    .key-box {
      border: 1px dashed #000;
      padding: 10px;
      font-family: monospace;
      font-size: 0.9rem;
      margin-bottom: 15px;
      word-break: break-all;
      text-align: center;
    }

    /* Not-Zurück-Button (Unten Rechts) */
    .exit-btn {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: #fff;
      border: 1px solid #000;
      padding: 5px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      z-index: 10000;
      font-family: monospace;
    }
    .exit-btn:hover {
      background: #000;
      color: #fff;
    }

    #app-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: white;
      z-index: 9999;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- VIEW 1: TARNUNG - SCHLICHTER TASCHENRECHNER -->
  <div id="view-calculator" class="view active">
    <div class="calc-container">
      <div id="calc-screen" class="calc-screen">0</div>
      <div class="calc-keys">
        <button class="calc-btn" onclick="calcClear()">C</button>
        <button class="calc-btn" onclick="calcAppend('/')">/</button>
        <button class="calc-btn" onclick="calcAppend('*')">*</button>
        <button class="calc-btn" onclick="calcAppend('-')">-</button>
        <button class="calc-btn" onclick="calcAppend('7')">7</button>
        <button class="calc-btn" onclick="calcAppend('8')">8</button>
        <button class="calc-btn" onclick="calcAppend('9')">9</button>
        <button class="calc-btn" onclick="calcAppend('+')">+</button>
        <button class="calc-btn" onclick="calcAppend('4')">4</button>
        <button class="calc-btn" onclick="calcAppend('5')">5</button>
        <button class="calc-btn" onclick="calcAppend('6')">6</button>
        <button class="calc-btn" onclick="calcCompute()">=</button>
        <button class="calc-btn" onclick="calcAppend('1')">1</button>
        <button class="calc-btn" onclick="calcAppend('2')">2</button>
        <button class="calc-btn" onclick="calcAppend('3')">3</button>
        <button class="calc-btn" style="visibility:hidden;"></button>
        <button class="calc-btn" style="grid-column: span 2;" onclick="calcAppend('0')">0</button>
        <button class="calc-btn" onclick="calcAppend('.')">.</button>
      </div>
    </div>
  </div>

  <!-- VIEW 2: UNLOCK SCREEN -->
  <div id="view-unlock" class="view">
    <div class="portal-box">
      <h1>Access</h1>
      <p>Key eingeben:</p>
      
      <label for="key-input">Key:</label>
      <input type="text" id="key-input" placeholder="MK-..." autocomplete="off">

      <button class="btn" onclick="unlockWithKey()">Unlock</button>
      <button class="btn" onclick="openLinkvertise(event)">Get Key</button>

      <div id="unlock-message" class="message"></div>
    </div>
    <button class="exit-btn" onclick="returnToCalculator()">Zurück</button>
  </div>

  <!-- VIEW 3: GET KEY SCREEN -->
  <div id="view-getkey" class="view">
    <div class="portal-box">
      <h1>Key Generator</h1>
      <p>Dein gerätegebundener Key:</p>

      <div id="generated-key-display" class="key-box">Lade...</div>

      <button class="btn" onclick="copyAndRedirect()">Key kopieren & Weiter</button>
    </div>
    <button class="exit-btn" onclick="returnToCalculator()">Zurück</button>
  </div>

  <!-- EMBEDDED MATHKIT APP -->
  <div id="app-container">
    <iframe src="https://mathkit.org" id="app-frame" title="MathKit App"></iframe>
    <button class="exit-btn" onclick="returnToCalculator()">Schließen / Zurück</button>
  </div>

  <script>
    const LINKVERTISE_URL = "https://link-hub.net/10624438/ADobqisFUWgc"; 
    const KEY_PREFIX = "MK-";
    const SECRET_SALT = "MATHKIT_DEVICE_LOCK_2026";

    // Taschenrechner Logik
    let calcInput = "0";

    function updateCalcScreen() {
      document.getElementById('calc-screen').innerText = calcInput;
    }

    function calcAppend(val) {
      if (calcInput === "0" && val !== '.') {
        calcInput = val;
      } else {
        calcInput += val;
      }
      updateCalcScreen();
    }

    function calcClear() {
      calcInput = "0";
      updateCalcScreen();
    }

    function calcCompute() {
      // GEHEIMER AUSLÖSER: Wenn exakt "000" eingegeben wurde
      if (calcInput === "000") {
        calcClear();
        showView('view-unlock');
        return;
      }

      try {
        // Sichere Auswertung für den simplen Taschenrechner
        let result = Function('"use strict";return (' + calcInput + ')')();
        calcInput = String(result);
      } catch (e) {
        calcInput = "Error";
      }
      updateCalcScreen();
    }

    // Portal Navigation & Logik
    window.addEventListener('DOMContentLoaded', () => {
      routeView();
    });

    function routeView() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('action') === 'getkey') {
        showView('view-getkey');
        generateAndDisplayKey();
      }
      // Startet ansonsten standardmäßig beim Taschenrechner (view-calculator)
    }

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('app-container').style.display = 'none';
      
      if (viewId === 'app-container') {
        document.getElementById('app-container').style.display = 'block';
      } else {
        document.getElementById(viewId).classList.add('active');
      }
    }

    function returnToCalculator() {
      // URL-Parameter ?action=getkey entfernen, falls vorhanden
      window.history.replaceState({}, document.title, window.location.pathname);
      calcClear();
      showView('view-calculator');
    }

    function openLinkvertise(e) {
      e.preventDefault();
      window.location.href = LINKVERTISE_URL;
    }

    function getDeviceFingerprint() {
      const nav = window.navigator;
      const screen = window.screen;
      const rawString = [
        nav.userAgent,
        nav.language,
        screen.width,
        screen.height,
        screen.colorDepth,
        new Date().getTimezoneOffset()
      ].join('|');
      
      return simpleHash(rawString);
    }

    function simpleHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash).toString(36).toUpperCase();
    }

    function generateKeyForTimestamp(timestamp, deviceHash) {
      const timeBlock = Math.floor(timestamp / (1000 * 60 * 60));
      const signature = simpleHash(timeBlock + deviceHash + SECRET_SALT);
      return `${KEY_PREFIX}${timeBlock.toString(36).toUpperCase()}-${deviceHash}-${signature}`;
    }

    function generateAndDisplayKey() {
      const now = Date.now();
      const deviceHash = getDeviceFingerprint();
      const currentKey = generateKeyForTimestamp(now, deviceHash);
      document.getElementById('generated-key-display').innerText = currentKey;
    }

    function validateKey(key) {
      if (!key || typeof key !== 'string') return false;
      const cleanKey = key.trim();
      const now = Date.now();
      const deviceHash = getDeviceFingerprint();
      
      for (let i = 0; i <= 24; i++) {
        const testTime = now - (i * 60 * 60 * 1000);
        if (generateKeyForTimestamp(testTime, deviceHash) === cleanKey) {
          return true;
        }
      }
      return false;
    }

    function unlockWithKey() {
      const inputField = document.getElementById('key-input');
      const messageField = document.getElementById('unlock-message');
      const key = inputField.value;

      messageField.innerText = '';

      if (validateKey(key)) {
        messageField.innerText = 'OK. Lade...';
        setTimeout(() => {
          showView('app-container');
        }, 400);
      } else {
        messageField.innerText = 'Ungültig.';
      }
    }

    function copyAndRedirect() {
      const keyText = document.getElementById('generated-key-display').innerText;
      
      const fallbackCopy = () => {
        window.location.href = window.location.origin + window.location.pathname;
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(keyText).then(() => {
          fallbackCopy();
        }).catch(() => {
          fallbackCopy();
        });
      } else {
        fallbackCopy();
      }
    }
  </script>
</body>
</html>
